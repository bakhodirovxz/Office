# CI mirror of scripts/ci.sh (PLAN 6.1-6.3). READY TO ENABLE, NOT ENABLED: `workflow_dispatch` only. Enabling means adding
# `push`/`pull_request` triggers once a remote is allowed (CLAUDE.md: no remote without the owner's OK).
# Untested until a remote exists; `actionlint` (job below and `scripts/ci.sh actionlint`) is the only check so far.
#
# Every step runs `scripts/ci.sh <job>`, so local and remote are one implementation. Before enabling:
#   1. Every `uses:` is pinned to a full commit SHA (resolved 2026-10-17; the version is in the trailing comment).
#      Keep it that way: update the SHAs only through reviewed PRs.
#   2. scripts/env.sh hard-codes this PC (E:/office-target, E:/office-tools, ...). Make it honour pre-set values
#      (OFFICE_TARGET="${OFFICE_TARGET:-E:/office-target/p1}" and so on), or set a runner-side override.
#   3. Decide the runner. GH caches are capped at 10 GB per repo, so release builds of four apps will not all stay
#      cached: size the runners or use a self-hosted runner.
# The windows-latest runners give the MSVC build that shipping needs (ADR 2.5); this PC builds windows-gnu.
name: ci

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "quick (per commit), full (gate) or nightly (full + release tests, fidelity, xlsx bench)"
        type: choice
        options: [quick, full, nightly]
        default: quick
      msvc:
        description: "also run the MSVC build job (WP13); SignPath signing is separate, signpath_submit below"
        type: boolean
        default: false
      desktop:
        description: "also run the desktop checks (hoshiya.exe templates, editors and shared-toolbar checks); needs a self-hosted Windows runner with an interactive desktop session"
        type: boolean
        default: false
      msi:
        description: "also build the suite MSI (WP14: MSVC builds + WiX); the install test is scripts/msi-test.ps1, elevated, run by the owner"
        type: boolean
        default: false
      signpath_submit:
        description: "WP13 stub, DISABLED until the SignPath Foundation project exists: submit the MSVC artefacts for signing"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CI_RUN: ${{ github.run_id }}
  # Only effective once scripts/env.sh honours a pre-set value (header, point 2).
  OFFICE_TARGET: ${{ github.workspace }}/.ci-target

defaults:
  run:
    shell: bash

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ hashFiles('Cargo.lock') }}
      - run: scripts/ci.sh queue

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ hashFiles('Cargo.lock') }}
      - run: scripts/ci.sh lint

  gen-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ hashFiles('Cargo.lock') }}
      - run: scripts/ci.sh gen-check

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ hashFiles('Cargo.lock') }}
      - run: scripts/ci.sh deny

  brand:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ hashFiles('Cargo.lock') }}
      - run: scripts/ci.sh brand

  i18n:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ hashFiles('Cargo.lock') }}
      - run: scripts/ci.sh i18n

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - name: Install actionlint 1.7.12
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 /usr/local/bin
      - run: scripts/ci.sh actionlint

  test:
    if: ${{ inputs.profile != 'quick' }}
    needs: [queue]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        app: [wordcraft, gridcraft, deckcraft, pdfcraft]
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ hashFiles(format('upstream/{0}/Cargo.lock', matrix.app)) }}
      - run: scripts/ci.sh test ${{ matrix.app }}

  test-ours:
    if: ${{ inputs.profile != 'quick' }}
    needs: [queue]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ hashFiles('Cargo.lock') }}
      - run: scripts/ci.sh test-ours

  check:
    needs: [queue]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        domain: [docs, sheets, slides, pdf]
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ hashFiles(format('domains/{0}/Cargo.lock', matrix.domain)) }}
      - run: scripts/ci.sh check ${{ matrix.domain }}

  bind:
    # WP13: docs-bind (approach B's binding layer): check + test, native and wasm32
    needs: [queue]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ hashFiles('domains/docs/Cargo.lock') }}
      - run: scripts/ci.sh bind

  build:
    if: ${{ inputs.profile != 'quick' }}
    needs: [check]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        domain: [docs, sheets, slides, pdf]
        kind: [desktop, web, cli]
        os: [windows-latest, ubuntu-latest]
        exclude:
          # the browser build does not depend on the OS: build it once, on Windows
          - kind: web
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ hashFiles(format('domains/{0}/Cargo.lock', matrix.domain)) }}
      - run: scripts/ci.sh build ${{ matrix.domain }} ${{ matrix.kind }}
      - name: Keep the web dist for sizes and web-smoke
        if: ${{ matrix.kind == 'web' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: dist-${{ matrix.domain }}-web
          path: ${{ env.OFFICE_TARGET }}/dist/${{ matrix.domain }}-web
          if-no-files-found: error

  sizes:
    if: ${{ inputs.profile != 'quick' }}
    needs: [build]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ hashFiles('Cargo.lock') }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
        with:
          pattern: dist-*-web
          path: dist
      - run: CI_DIST_ROOT="$PWD/dist" scripts/ci.sh sizes

  web-smoke:
    if: ${{ inputs.profile != 'quick' }}
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ hashFiles('Cargo.lock') }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
        with:
          pattern: dist-*-web
          path: dist
      - run: npm ci --prefix ci/web-smoke && npm exec --prefix ci/web-smoke -- playwright install --with-deps chromium
      - run: CI_DIST_ROOT="$PWD/dist" scripts/ci.sh web-smoke

  translit-npm:
    # WP8: the uz-translit npm package: build, size budget, node tests, Chromium smoke. Nothing is published.
    needs: [queue]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ hashFiles('Cargo.lock') }}
      - name: wasm-bindgen 0.2.129 and binaryen 123 (linux builds of the pins in scripts/tools.lock, sha256-checked)
        run: |
          mkdir -p "$HOME/.office-bin"
          curl -fsSLO https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz
          curl -fsSLO https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz
          echo "82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e  wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz" | sha256sum -c -
          echo "e959f2170af4c20c552e9de3a0253704d6a9d2766e8fdb88e4d6ac4bae9388fe  binaryen-version_123-x86_64-linux.tar.gz" | sha256sum -c -
          tar xzf wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz --strip-components=1 -C "$HOME/.office-bin" --wildcards '*/wasm-bindgen'
          tar xzf binaryen-version_123-x86_64-linux.tar.gz --strip-components=2 -C "$HOME/.office-bin" binaryen-version_123/bin/wasm-opt
          echo "$HOME/.office-bin" >> "$GITHUB_PATH"
      - run: npm exec --prefix ci/web-smoke -- playwright install --with-deps chromium || (npm ci --prefix ci/web-smoke && npm exec --prefix ci/web-smoke -- playwright install --with-deps chromium)
      - run: scripts/ci.sh translit-npm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: uz-translit-npm
          path: ${{ env.OFFICE_TARGET }}/dist/npm/*.tgz
          if-no-files-found: error

  translit-preserve:
    # Phase 2 WP9/WP11: xlsx/pptx formatting preservation of the transliteration (builds the release sheets/slides CLIs)
    if: ${{ inputs.profile != 'quick' }}
    needs: [queue]
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ hashFiles('domains/sheets/Cargo.lock', 'domains/slides/Cargo.lock') }}
      - run: scripts/ci.sh translit-preserve

  translit-perf:
    # Phase 2 WP10/WP11: 108-page docx, command -> layout under 2 s (release test perf_108; ignored in every other run)
    if: ${{ inputs.profile == 'nightly' }}
    needs: [queue]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ hashFiles('domains/docs/Cargo.lock') }}
      - run: scripts/ci.sh translit-perf

  release-tests:
    if: ${{ inputs.profile == 'nightly' }}
    needs: [test]
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ hashFiles('upstream/*/Cargo.lock') }}
      - run: scripts/ci.sh release-tests all

  fidelity:
    if: ${{ inputs.profile == 'nightly' }}
    needs: [build]
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ hashFiles('Cargo.lock') }}
      - run: scripts/ci.sh fidelity

  xlsx-bench:
    if: ${{ inputs.profile == 'nightly' }}
    needs: [build]
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ hashFiles('Cargo.lock') }}
      - run: scripts/ci.sh xlsx-bench

  convert:
    # Phase 3 WP12: the services workspace (convert, convert-api): clippy -D warnings, nextest, cargo-deny (ci/deny/services.toml).
    # Quick profile on a diff: add `paths: [services/**]` to the push trigger when the workflow is enabled.
    if: ${{ inputs.profile != 'quick' }}
    needs: [queue]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ hashFiles('services/Cargo.lock') }}
      - run: scripts/ci.sh convert

  convert-e2e:
    # Phase 3 WP12: release CLIs + services; API all-directions e2e, services/convert/tests/directions.sh, the converter Playwright spec.
    # Needs MS Office 16 on the runner when the synthetic inputs have to be (re)generated (census.ps1 -Phase prep): self-hosted Windows.
    if: ${{ inputs.profile != 'quick' }}
    needs: [convert]
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ hashFiles('services/Cargo.lock', 'domains/*/Cargo.lock') }}
      - run: npm ci --prefix ci/web-smoke && npm exec --prefix ci/web-smoke -- playwright install --with-deps chromium
      - run: scripts/ci.sh convert-e2e

  sidecars:
    # Phase 3 WP12: docker build + the in-image tests of sidecars/pdf2docx and sidecars/soffice. Nightly; on a diff add `paths: [sidecars/**]`.
    if: ${{ inputs.profile == 'nightly' }}
    needs: [queue]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - run: scripts/ci.sh sidecars

  fidelity-directions:
    # Phase 3 WP12: every direction through convert against the references; fails on a NEW "loss without warning"
    # (ci/fidelity/silent-baseline.json). The MS Office reference needs the self-hosted runner; x2t is optional (X2T_URL).
    if: ${{ inputs.profile == 'nightly' }}
    needs: [convert-e2e]
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ hashFiles('services/Cargo.lock', 'domains/*/Cargo.lock') }}
      - run: scripts/ci.sh fidelity-directions
        env:
          X2T_URL: ${{ vars.X2T_URL }}

  msvc:
    # WP13: x86_64-pc-windows-msvc release builds (scripts/build.sh all all --release --msvc). On demand only (input msvc).
    if: ${{ inputs.msvc }}
    needs: [queue]
    runs-on: windows-latest
    timeout-minutes: 240
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ hashFiles('services/Cargo.lock', 'domains/*/Cargo.lock') }}
      - run: scripts/ci.sh msvc
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: msvc-unsigned
          path: |
            ${{ env.OFFICE_TARGET }}/msvc/*/x86_64-pc-windows-msvc/release/*.exe
          if-no-files-found: error

  shell:
    # Phase 4 WP7/WP22: suite-serve tests, the .br files, the shell Playwright spec and the templates spec, sizes. The editor dists must be built
    # on the runner first (the build jobs above); the self-hosted Windows runner keeps $OFFICE_TARGET/dist between runs.
    if: ${{ inputs.profile != 'quick' }}
    needs: [convert]
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ hashFiles('services/Cargo.lock', 'domains/*/Cargo.lock') }}
      - run: npm ci --prefix ci/web-smoke && npm exec --prefix ci/web-smoke -- playwright install --with-deps chromium
      - run: scripts/ci.sh disk-guard shell

  desktop:
    # Phase 4 WP22, on demand (input desktop): drives the real hoshiya.exe and the editor exes, so it needs an interactive desktop session.
    # Restores the user's settings.toml afterwards (toolbar-share-check.py uses the real one).
    if: ${{ inputs.desktop }}
    needs: [queue]
    runs-on: [self-hosted, windows, x64]   # the runner must run in an interactive desktop session
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ hashFiles('services/Cargo.lock', 'domains/*/Cargo.lock') }}
      - run: scripts/ci.sh disk-guard desktop
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: desktop-checks
          path: ${{ env.OFFICE_TARGET }}/ci/${{ github.run_id }}/desktop
          if-no-files-found: ignore

  msi:
    # Phase 4 WP14, on demand (input msi): MSVC release builds, shell dist, overlay, WiX 5.0.2 (scripts/build-msi.ps1). Builds the MSI; nothing is installed.
    if: ${{ inputs.msi }}
    needs: [queue]
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ hashFiles('services/Cargo.lock', 'domains/*/Cargo.lock') }}
      - run: scripts/ci.sh disk-guard msi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: msi-unsigned
          path: ${{ env.OFFICE_TARGET }}/msi/*.msi
          if-no-files-found: error

  signpath:
    # WP13 stub, docs/phase4/signing.md section "Public releases". Public releases are signed by SignPath Foundation from a
    # CI build of the PUBLIC repo; no key is ever on a runner. DISABLED: needs input signpath_submit, a public repo, the
    # SignPath project and the secret SIGNPATH_API_TOKEN, none of which exist yet. Verify the action inputs when enabling.
    if: ${{ inputs.signpath_submit && inputs.msvc }}
    needs: [msvc]
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read   # SignPath reads the uploaded artefact back from this run
    steps:
      - uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627   # v2.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: office-suite
          signing-policy-slug: release-signing
          github-artifact-id: ${{ needs.msvc.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: msvc-signed
          path: signed
          if-no-files-found: error
