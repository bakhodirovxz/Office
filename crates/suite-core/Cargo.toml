[package]
name = "suite-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Shared services of the suite (PLAN phase 4, section 5, WP5): the per-user settings.toml, the language choice, the recent files of the four apps, the shared fonts and the templates"
build = "build.rs"

[dependencies]
toml_edit = "0.22"
serde_json = "1"
sha2 = "0.10"
# eframe keeps pdfcraft's state in app.ron, a RON map of strings
ron = "0.8"

[build-dependencies]
toml_edit = "0.22"

[dev-dependencies]
roxmltree = "0.20"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
