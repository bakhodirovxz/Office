[package]
name = "suite-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Shared services of the suite (PLAN phase 4, section 5, WP5): the per-user settings.toml, the language choice, the recent files of the four apps, the shared fonts and the templates"
build = "build.rs"

[dependencies]
toml_edit = "0.22"
serde_json = "1"
sha2 = "0.10"
# Phase 7 WP8: the plugin store reads and validates packages with the plugin API and reads the "Install from file" zip
plugin-api = { path = "../plugin-api" }
zip = { version = "9", default-features = false, features = ["deflate"] }
# Phase 7 O4: Ed25519 package signatures. ring is already in the root and docs graphs (rustls in plugin-host and the services)
ring = { version = "0.17", default-features = false }
# eframe keeps pdfcraft's state in app.ron, a RON map of strings
ron = "0.8"

[build-dependencies]
toml_edit = "0.22"

[dev-dependencies]
roxmltree = "0.20"
