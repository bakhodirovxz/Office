# Phase 7 WP13: the app-neutral half of the Sheets and Slides plugin adapters (docs/phase7/PLAN.md sections 4, 5 and 11 WP13).
# The loaded plugins and their slots, the action executor (allowlist, one undo step, restore on error, stale check, limits), the web
# bridge's pending invocations and its JS end. The engine side (the text map, the undo step, the slot table) is the `Editor` trait,
# implemented by `domains/sheets/crates/sheets-plugins` and `domains/slides/crates/slides-plugins`. Docs keeps `docs-plugins`.
[package]
name = "plugin-adapter"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "App-neutral plugin adapter for the Sheets and Slides editors: slots, executor, web bridge"

[dependencies]
plugin-api = { path = "../plugin-api" }
serde_json = "1"

# the browser end of the bridge (web.rs)
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"

# `native`: the wasmtime guest and the loader of the suite-core store (native.rs). Never in a wasm build.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
plugin-host = { path = "../plugin-host", optional = true }
suite-core = { path = "../suite-core", optional = true }

[features]
native = ["dep:plugin-host", "dep:suite-core"]
