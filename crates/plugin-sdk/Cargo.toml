# Phase 7 WP6: the Rust SDK for plugins (docs/plugins.md). alloc/free/call glue for the ABI of section 3, the message codec and typed
# actions come from `plugin-api` (the same code the host runs); no proc macros.
[package]
name = "plugin-sdk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Rust SDK for plugins: ABI glue (alloc, free, call) over plugin-api"

[dependencies]
plugin-api = { path = "../plugin-api" }
