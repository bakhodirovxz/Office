# Phase 7 WP1: the plugin API v1 as data and codecs (manifest + refusals, message envelope, text map, actions, permissions,
# command allowlist, versioning). No I/O and no runtime: the native host, the web page host and the Docs adapter all link this.
[package]
name = "plugin-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Plugin API v1: manifest validation, message envelope, text map codec, actions, permissions and the command allowlist"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }
