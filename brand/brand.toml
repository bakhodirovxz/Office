# The one brand config (docs/phase1/designs/brand.md section 2). This file is the ONLY place that contains the product
# name (decided by the owner, 2026-10-23: ADR B-1). `cargo xt brand check` validates it,
# `cargo xt overlay <app>` renders it into $OFFICE_OVERLAY_ROOT/<app>/.
schema = 1

[product]
id = "hoshiya"
name = "Hoshiya"
version = "0.4.0"
# MSI UpgradeCode: FROZEN. Never change it, or a new MSI no longer upgrades the installed one. (It is the value the first pilot MSIs derived from the id.)
upgrade_code = "{2EA291EA-35AE-59D4-AB3E-09D1AE815A49}"
vendor = "Hoshiya contributors"
copyright = "Copyright (c) the Hoshiya contributors. MIT OR Apache-2.0."

# Plain text only (brand licence: "You may say, in plain text, that your work is based on ..."). The owner reviews the wording.
[attribution]
en = "Based on WordCraft, GridCraft, DeckCraft and PdfCraft by the ArtCraft team (MIT OR Apache-2.0)."
ru = "Основано на WordCraft, GridCraft, DeckCraft и PdfCraft от команды ArtCraft (MIT OR Apache-2.0)."
uz-Latn = "WordCraft, GridCraft, DeckCraft va PdfCraft (ArtCraft jamoasi, MIT OR Apache-2.0) asosida."
uz-Cyrl = "WordCraft, GridCraft, DeckCraft ва PdfCraft (ArtCraft жамоаси, MIT OR Apache-2.0) асосида."

[apps.docs]
upstream = "wordcraft"
upstream_names = ["WordCraft"]
bin = "hoshiya-docs"
cli = "hoshiya-docs-cli"
app_id = "hoshiya.docs"
aumid = "Hoshiya.Docs"
data_dir = "Hoshiya/Docs"
pictogram = "lines"
names = { en = "Hoshiya Docs", ru = "Hoshiya Документы", uz-Latn = "Hoshiya Hujjatlar", uz-Cyrl = "Ҳошия Ҳужжатлар" }

[apps.sheets]
upstream = "gridcraft"
upstream_names = ["GridCraft"]
bin = "hoshiya-sheets"
cli = "hoshiya-sheets-cli"
app_id = "hoshiya.sheets"
aumid = "Hoshiya.Sheets"
data_dir = "Hoshiya/Sheets"
pictogram = "grid"
names = { en = "Hoshiya Sheets", ru = "Hoshiya Таблицы", uz-Latn = "Hoshiya Jadvallar", uz-Cyrl = "Ҳошия Жадваллар" }

[apps.slides]
upstream = "deckcraft"
upstream_names = ["DeckCraft"]
bin = "hoshiya-slides"
cli = "hoshiya-slides-cli"
app_id = "hoshiya.slides"
aumid = "Hoshiya.Slides"
data_dir = "Hoshiya/Slides"
pictogram = "slide"
names = { en = "Hoshiya Slides", ru = "Hoshiya Презентации", uz-Latn = "Hoshiya Taqdimotlar", uz-Cyrl = "Ҳошия Тақдимотлар" }

[apps.pdf]
upstream = "pdfcraft"
upstream_names = ["PdfCraft"]
bin = "hoshiya-pdf"
cli = "hoshiya-pdf-cli"
app_id = "hoshiya.pdf"
aumid = "Hoshiya.Pdf"
data_dir = "Hoshiya/Pdf"
storage_key = "hoshiya-pdf"
pictogram = "page"
names = { en = "Hoshiya PDF", ru = "Hoshiya PDF", uz-Latn = "Hoshiya PDF", uz-Cyrl = "Ҳошия PDF" }

[apps.convert]
upstream = ""   # no engine: our own thin layer (services/convert)
upstream_names = []
bin = "hoshiya-convert"
cli = "hoshiya-convert-cli"
app_id = "hoshiya.convert"
aumid = "Hoshiya.Convert"
data_dir = "Hoshiya/Convert"
pictogram = "page"
names = { en = "Hoshiya Convert", ru = "Hoshiya Конвертер", uz-Latn = "Hoshiya Konvertor", uz-Cyrl = "Ҳошия Конвертор" }

# The Hoshiya logo pack (brand/logo/README.txt). accent_dark is the accent on a dark surface (checked against ink, 4.5:1);
# accent_margin is the mark's orange bar, drawn down the left edge of every app icon (checked against accent_light, 3:1).
[colors]
accent_light = "#1E4FA3"
accent_dark = "#6C9BF0"
icon_fg = "#FFFFFF"
accent_margin = "#E9A23B"
ink = "#101828"

# Upstream community chrome. All off in our builds.
[chrome]
community = false
share = false
zotero = false
update_check = false
upstream_links = false
contributors_tab = true

# Our own links. Empty string = the item is hidden.
[links]
website = ""
help = ""
source = ""

# Fallback UI/document fonts (WP8, designs/font.md). Paths are relative to assets/fonts/.
[fonts]
fallback_sans = "fallback/NotoSans-Regular-uz.ttf"
fallback_mono = "fallback/NotoSansMono-Regular-uz.ttf"
