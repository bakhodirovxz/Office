[package]
name = "uz-keyboard-spike"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Throwaway Phase 0 spike: the smallest TSF text input processor that turns s+h into the 2026 letter while typing"

# Own workspace: spikes are excluded from the root one.
[workspace]

[lib]
name = "uzkbd_spike"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "kbdctl"
path = "src/bin/kbdctl.rs"

[dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_UI_TextServices",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }
windows-core = "=0.62.2"

[profile.release]
panic = "abort"
