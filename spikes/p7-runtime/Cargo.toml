# Phase 7 planning spike (throwaway, not product code): which wasm runtime for native plugins, and what the
# plugin boundary costs for uz-translit. See README.md. Own workspace, excluded from the root workspace (`spikes`).
[workspace]
members = ["plugin", "host", "size-base", "size-wasmtime", "size-wasmi"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.release]
strip = true
codegen-units = 1

[profile.plugin]
inherits = "release"
opt-level = "s"
lto = true
panic = "abort"
