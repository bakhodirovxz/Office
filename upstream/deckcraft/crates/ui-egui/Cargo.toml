[package]
name = "deckcraft-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DeckCraft egui frontend (PowerPoint-style UI); swappable — nothing below depends on it"

[lints]
workspace = true

[dependencies]
deckcraft-geom = { workspace = true }
deckcraft-color = { workspace = true }
deckcraft-model = { workspace = true }
deckcraft-fonts = { workspace = true }
deckcraft-text = { workspace = true }
deckcraft-render = { workspace = true }
deckcraft-anim = { workspace = true }
deckcraft-engine = { workspace = true }
deckcraft-media = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
# patches/deckcraft/0174: the web reads and saves the toolbar mode through suite-core (localStorage)
suite-core = { path = "../../../../crates/suite-core" }

# the shared per-user settings (the toolbar mode); the web has no settings file
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
suite-core = { path = "../../../../crates/suite-core" }
# office overlay (patches/deckcraft/0143): the XDFU grif finder, stamp line and keyed audit chain
xdfu-core = { path = "../../../../crates/xdfu-core" }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
# office overlay (patches/deckcraft/0143): reads the text of a stamped PDF in tests/office_xdfu.rs
hayro-syntax = { version = "=0.7.2", default-features = false, features = ["std"] }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
