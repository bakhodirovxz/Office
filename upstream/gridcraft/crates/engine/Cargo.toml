[package]
name = "gridcraft-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GridCraft engine: sessions, commands, history, clipboard, fill, sort, filter"

[lints]
workspace = true

[dependencies]
gridcraft-core = { workspace = true }
gridcraft-numfmt = { workspace = true }
gridcraft-formula = { workspace = true }
gridcraft-functions = { workspace = true }
gridcraft-model = { workspace = true }
gridcraft-calc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
gridcraft-xlsx = { workspace = true }
gridcraft-chart = { workspace = true }
gridcraft-pdf = { workspace = true }
# Ubuntu Light, the PDF export's last-resort face for Latin, Greek and Cyrillic (the bytes egui ships).
# Optional: the desktop and web apps already carry these bytes inside egui and hand them over at
# startup (`pdf_fonts::set_default_face`), so linking a second copy would only grow the wasm.
epaint_default_fonts = { workspace = true, optional = true }
image = { workspace = true }
# office overlay (patches/gridcraft/0120): the transliteration rules, an in-monorepo path
uz-translit = { path = "../../../../crates/uz-translit" }

[dev-dependencies]
epaint_default_fonts = { workspace = true }
gridcraft-xlsx = { workspace = true, features = ["test-support"] }
zip = { workspace = true }

[features]
bundled-pdf-font = ["dep:epaint_default_fonts"]
