[package]
name = "gridcraft-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GridCraft command line: inspect, convert, evaluate, script and serve MCP without a window"
publish = false

[lints]
workspace = true

[[bin]]
name = "gridcraft-cli"
path = "src/main.rs"

[dependencies]
# The headless CLI has no egui to lend it a default PDF face, so it carries one.
gridcraft-engine = { workspace = true, features = ["bundled-pdf-font"] }
gridcraft-mcp = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# `check`: validating the packages GridCraft writes (content types, relationships).
zip = { workspace = true }
quick-xml = { workspace = true }
