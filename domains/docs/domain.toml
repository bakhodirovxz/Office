# Generator input for cargo xt gen-domain (PLAN WP3)
upstream = "wordcraft"

[desktop]
src = "wordcraft"
bin = "docs"

[web]
src = "wordcraft-web"
bin = "docs-web"

[cli]
src = "wordcraft-cli"
bin = "docs-cli"

# Our crates every app links (cargo xt gen-domain: optional path dependency + default `office-ext` feature; PLAN section 3.1)
[extensions]
crates = ["docs-translit"]
