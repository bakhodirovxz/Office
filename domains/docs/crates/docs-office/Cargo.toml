# Phase 4 WP2/WP4: the simplified Docs ribbon (a preset through Customize Ribbon), its toggle, and the command-hook seam.
# Our crate: the logic lives here; upstream only gets the install hook (patches/wordcraft/0120) and the frame/icon hook (0122).
[package]
name = "docs-office"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
description = "Simplified ribbon preset, simple/full toggle and command hooks for the wordcraft engine"
publish = false

[lints]
workspace = true

[dependencies]
wordcraft-engine = { path = "../../../../upstream/wordcraft/crates/engine" }
egui = "0.36"
serde_json = { version = "1", features = ["float_roundtrip"] }
wordcraft-doc = { path = "../../../../upstream/wordcraft/crates/doc" }
# Phase 7 WP3: the plugins' ribbon group and the per-frame registration
docs-plugins = { path = "../docs-plugins" }

# Phase 7 WP4: the browser end of the plugin bridge (plugin_web.rs)
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"

# The shared per-user settings (WP5): a file on the desktop, localStorage and ?toolbar= on the web.
suite-core = { path = "../../../../crates/suite-core" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
xdfu-core = { path = "../../../../crates/xdfu-core" }
# Phase 7: the native plugin host (wasmtime) behind docs_plugins::Guest. Not in the wasm32 build.
plugin-host = { path = "../../../../crates/plugin-host" }
plugin-api = { path = "../../../../crates/plugin-api" }

[dev-dependencies]
# reads the text of an exported PDF in the XDFU tests (the version wordcraft crates/pdf uses)
hayro-syntax = { version = "=0.7.2", default-features = false, features = ["std"] }
docs-translit = { path = "../docs-translit" }
# the plugin allowlist is data in plugin-api; this crate can see the real registry it must match (Phase 7 WP1)
plugin-api = { path = "../../../../crates/plugin-api" }
