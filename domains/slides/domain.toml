# Generator input for cargo xt gen-domain (PLAN WP3)
upstream = "deckcraft"

[desktop]
src = "deckcraft"
bin = "slides"

[web]
src = "deckcraft-web"
bin = "slides-web"

[cli]
src = "deckcraft-cli"
bin = "slides-cli"

# Our crates every app links (cargo xt gen-domain: optional path dependency + default `office-ext` feature; PLAN section 3.1).
# Phase 7 WP13: the plugin adapter.
[extensions]
crates = ["slides-plugins"]
