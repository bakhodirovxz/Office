# GENERATED by cargo xt gen-domain pdf from upstream/pdfcraft@924c4da; edit domain.toml instead
[workspace]
members = ["apps/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# `"*"` matches every non-workspace package: crates.io dependencies and the
# vendored crates under `vendor/` (excluded from the workspace). Our own crates
# keep full debug info. Dependencies keep only line tables, so backtraces still
# show file and line, but debug info for the whole dependency graph stays out of
# every test binary (each UI test binary had a 500-600 MB PDB on Windows, #454).
[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"

[profile.dev]
opt-level = 1

[profile.low-disk]
inherits = "dev"
debug = "line-tables-only"
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1

[patch]

[patch.crates-io]
hayro-interpret = { path = "../../upstream/pdfcraft/vendor/hayro-interpret" }
hayro = { path = "../../upstream/pdfcraft/vendor/hayro" }
hayro-syntax = { path = "../../upstream/pdfcraft/vendor/hayro-syntax" }
hayro-jbig2 = { path = "../../upstream/pdfcraft/vendor/hayro-jbig2" }
lopdf = { path = "../../upstream/pdfcraft/vendor/lopdf" }
winit = { path = "../../upstream/pdfcraft/vendor/winit" }
egui-wgpu = { path = "../../upstream/pdfcraft/vendor/egui-wgpu" }
vello_common = { path = "../../upstream/pdfcraft/vendor/vello_common" }
