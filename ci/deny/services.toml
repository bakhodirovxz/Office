# cargo-deny policy for the services workspace (services/convert, later convert-api; PLAN phase 3 section 2.1, WP2). Copy of the root policy.
# Run: cargo deny --manifest-path services/Cargo.toml --config ci/deny/services.toml check
# One config per workspace: this file is the root; ci/deny/<domain>.toml are the four product domains.
# Keep the five files in step: the [licenses] allow list and [sources] are the shared policy.
# Our layer is MIT OR Apache-2.0 and links permissive code only. GPL/AGPL/LGPL/MPL is never allowed:
# such tools run as sidecar processes only (CLAUDE.md, hard constraints).

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
]

[licenses.private]
ignore = true

[bans]
# 32 duplicate crate names are known across the upstream graphs; report, do not fail.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []

[advisories]
version = 2
yanked = "warn"
git-fetch-with-cli = true
db-path = "E:/office-cache/advisory-db"
# Each ignore needs: RUSTSEC id, reason, review date. None for the services workspace.
ignore = []
