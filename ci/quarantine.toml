# Known upstream test failures: the quarantine (PLAN section 6.5). Read by `cargo xt quarantine apply|check` (WP6b);
# until that exists, `scripts/ci.sh quarantine` validates the format with a shell checker.
#
# One [[test]] table per test. Required, non-empty: app, crate, binary, name, class, env, reason, evidence, since, review.
#   app      wordcraft | gridcraft | deckcraft | pdfcraft   (upstream workspace the test lives in)
#   crate    cargo package name
#   binary   nextest binary kind: "lib" for unit tests in src/, the integration-test file name for tests/<name>.rs,
#            "bin/<name>" for a binary target's unit tests
#   name     exact test path inside the binary (nextest `test(=...)`)
#   class    env | upstream-bug | flaky | flaky-crash | brand-overlay | i18n-incomplete | debug-only
#   env      where it fails (CI applies the entry only there); "any" when it fails everywhere
#   reason   why it fails, one sentence
#   evidence file#anchor with the failing output (debug-only entries must show the release pass)
#   since    "<date>@<BASE sha7>" of the first observation
#   review   when to look again ("every sync" by default)
# Optional: provisional = true   cause not yet diagnosed; policy: each needs a one-paragraph diagnosis in WP6b to stay.
# Policy (PLAN 6.5): green = no non-quarantined failure and no crash; a quarantined test that passes is "stale" (two
# consecutive stale runs fail CI); no entry may hide a failure caused by our own patches except brand-overlay and
# i18n-incomplete; every entry has reason and evidence. Seeded from Phase 0 (docs/phase0/inventory.md); each entry is
# to be re-verified at the new BASE in WP6b and dropped if it now passes. Test paths not named in the inventory
# (module path of the pdfcraft i18n tests, binary ids) are best guesses from the sources and are confirmed there too.

