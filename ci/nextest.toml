# cargo-nextest configuration for scripts/ci.sh test (PLAN WP6b). Use with --config-file ci/nextest.toml.
# nextest runs every test in its own process (this is also why the deckcraft ui-egui concurrency crash does not
# reproduce; see docs/phase1/tests.md).

[profile.default]
fail-fast = false

# Blocking profile: no retries (a flake must be quarantined with a reason, not hidden), keep going after a failure.
[profile.ci]
retries = 0
fail-fast = false
slow-timeout = { period = "120s", terminate-after = 5 }
status-level = "fail"
final-status-level = "fail"
failure-output = "immediate-final"

# Quarantined pass (cargo xt quarantine apply): only the quarantined tests, expected to fail. JUnit tells the xtask
# which of them passed (= stale). The profile never fails the CI by itself.
[profile.quarantine]
retries = 0
fail-fast = false
slow-timeout = { period = "120s", terminate-after = 5 }
status-level = "none"
final-status-level = "none"
failure-output = "never"

[profile.quarantine.junit]
path = "junit.xml"

# Flake probe: retries, applied only to tests of quarantine class `flaky` (a filterset generated by the xtask is
# passed with -E). Not used by the blocking jobs.
[profile.flaky]
retries = 2
fail-fast = false
slow-timeout = { period = "120s", terminate-after = 5 }

# The egui_kittest wgpu suites would go here if they needed to be serialised:
#   [test-groups]
#   gpu-serial = { max-threads = 1 }
#   [[profile.ci.overrides]]
#   filter = 'binary_id(=deckcraft-ui-egui)'
#   test-group = 'gpu-serial'
# Not enabled: process-per-test did not reproduce the crash (docs/phase1/tests.md).
