[alias]
xt = "run -q -p xtask --"

# Build output never goes to C:. Domain and upstream builds override this with CARGO_TARGET_DIR (scripts/build.sh).
[build]
target-dir = "E:/office-target/p1/core"

# windows-msvc: static imports resolve in the application directory and System32 only, never the current directory or PATH
# (review m8). Applies to every msvc build in this tree, hoshiya.exe and the editors.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/DEPENDENTLOADFLAG:0xA00"]
