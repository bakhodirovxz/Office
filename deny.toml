# cargo-deny policy for the root workspace "core" (PLAN section 6.6; modelled on upstream/pdfcraft/deny.toml).
# Run: cargo deny --manifest-path Cargo.toml --config deny.toml check   (or: scripts/ci.sh deny)
# One config per workspace: this file is the root; ci/deny/<domain>.toml are the four product domains.
# Keep the five files in step: the [licenses] allow list and [sources] are the shared policy.
# Our layer is MIT OR Apache-2.0 and links permissive code only. GPL/AGPL/LGPL/MPL is never allowed:
# such tools run as sidecar processes only (CLAUDE.md, hard constraints).

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
]

[licenses.private]
ignore = true

[bans]
# 32 duplicate crate names are known across the upstream graphs; report, do not fail.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/storytold/craft-libs", "https://github.com/storytold/winprint.rs"]

[advisories]
version = 2
yanked = "warn"
git-fetch-with-cli = true
db-path = "E:/office-cache/advisory-db"
# Each ignore needs: RUSTSEC id, reason, review date. None for the root workspace.
ignore = []

# egui's default UI fonts (Ubuntu-Light, Hack, emoji-icon-font): font licences, attributed upstream as dependency-bundled assets.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

# winprint (craft-print's Windows spooler) lists reqwest as a build-dependency for a PDFium download that only runs with a
# feature craft-print turns off. The CA bundle is CDLA-Permissive-2.0 data used in a build script only.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]
