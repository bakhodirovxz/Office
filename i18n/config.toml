# i18n configuration (docs/phase1/designs/i18n.md section 5; owner decision 2026-10-17, ADR Appendix C).
#
# Fallback chains are applied by `cargo xt i18n export`, never at run time. A step only supplies a value
# that is trusted in the export mode (release: `reviewed:owner` Uzbek rows and upstream ru; review: drafts too).
# `en` ends every chain and means "write nothing": the app falls back to English by itself, and an English copy
# is never written into an Uzbek catalog.
[chains]
uz-latn = ["uz-latn", "en"]
uz-cyrl = ["uz-cyrl", "ru", "en"]
ru = ["ru", "en"]

# Who is trusted as a reviewer of Uzbek text. Owner decision 2026-10-18 (CLAUDE.md gate decisions): the owner delegated
# the review of the uz-Latn and uz-Cyrl UI strings to the agent ("check them yourself; I will report problems found in
# use"). With `trust_agent_review = true`, a `reviewed:agent-<model>:<date>` value is trusted like `reviewed:owner`:
# release exports include it and the language pickers drop the "(qoralama)" marker once every P1 row is trusted.
# Lint, coverage and export still count owner-reviewed and agent-reviewed rows apart. Set it to false to go back to
# owner-only trust.
[review]
trust_agent_review = true
