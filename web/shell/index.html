<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<link rel="icon" href="shell/favicon.ico" sizes="48x48">
<link rel="icon" href="shell/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="shell/apple-touch-icon.png">
<link rel="manifest" href="shell/site.webmanifest">
<meta name="theme-color" content="#1E4FA3">
<link rel="stylesheet" href="shell/shell.css">
</head>
<body>
<div id="home">
  <header class="bar">
    <picture class="logo"><source media="(prefers-color-scheme: dark)" srcset="shell/logo-dark.svg"><img src="shell/logo-light.svg" alt="" height="32"></picture>
    <h1 id="product" class="sr"></h1>
    <label class="search"><span class="sr" data-i18n="home.search"></span>
      <input id="search" type="search" autocomplete="off" data-i18n-ph="home.search"></label>
    <label class="lang"><span class="sr" data-i18n="ui.language"></span>
      <select id="lang">
        <option value="en">English</option>
        <option value="ru">Русский</option>
        <option value="uz-Latn">Oʻzbekcha</option>
        <option value="uz-Cyrl">Ўзбекча</option>
      </select></label>
  </header>
  <main>
    <p id="guard" role="alert" hidden><span id="guard-text"></span> <button id="guard-excel" type="button" class="btn" hidden data-i18n="guard.excel"></button></p>
    <section aria-labelledby="h-new">
      <h2 id="h-new" data-i18n="home.new"></h2>
      <ul id="cards" class="cards"></ul>
      <p><button id="open-file" type="button" class="btn" data-i18n="home.open"></button>
        <span class="muted" data-i18n="home.open.hint"></span>
        <input id="file" type="file" hidden></p>
    </section>
    <section id="sec-templates" aria-labelledby="h-tpl" hidden>
      <h2 id="h-tpl" data-i18n="home.templates"></h2>
      <ul id="templates" class="cards"></ul>
    </section>
    <section aria-labelledby="h-recent">
      <h2 id="h-recent" data-i18n="home.recent"></h2>
      <p id="recent-note" class="muted" data-i18n="home.recent.note"></p>
      <ul id="recent" class="list"></ul>
      <p id="recent-empty" class="muted" hidden></p>
    </section>
    <section aria-labelledby="h-conv">
      <h2 id="h-conv" data-i18n="home.convert"></h2>
      <p><a id="convert" class="btn" href="/convert/"></a>
        <span class="muted" data-i18n="home.convert.hint"></span></p>
    </section>
    <p id="error" class="error" role="alert" hidden></p>
  </main>
</div>
<div id="editor" hidden>
  <div class="bar">
    <button id="back" type="button" class="btn" data-i18n="ed.back"></button>
    <strong id="ed-title"></strong>
    <span id="ed-status" class="muted" role="status"></span>
  </div>
  <div id="frames"></div>
</div>
<script src="shell/shell.js"></script>
</body>
</html>
