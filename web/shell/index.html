<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<link rel="icon" href="shell/favicon.ico" sizes="48x48">
<link rel="icon" href="shell/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="shell/apple-touch-icon.png">
<link rel="manifest" href="shell/site.webmanifest">
<meta name="theme-color" content="#1E4FA3">
<link rel="stylesheet" href="shell/shell.css">
<link rel="stylesheet" href="shell/history.css">
</head>
<body>
<div id="home">
  <header class="bar">
    <picture class="logo"><source id="logo-dark" media="(prefers-color-scheme: dark)" srcset="shell/logo-dark.svg"><img src="shell/logo-light.svg" alt="" height="32"></picture>
    <h1 id="product" class="sr"></h1>
    <label class="search"><span class="sr" data-i18n="home.search"></span>
      <input id="search" type="search" autocomplete="off" data-i18n-ph="home.search"></label>
    <button id="nav-history" type="button" class="btn ghost" hidden data-i18n="hist.nav"></button>
    <label class="lang"><span class="sr" data-i18n="ui.language"></span>
      <select id="lang">
        <option value="en">English</option>
        <option value="ru">Русский</option>
        <option value="uz-Latn">Oʻzbekcha</option>
        <option value="uz-Cyrl">Ўзбекча</option>
      </select></label>
    <label class="lang"><span class="sr" data-i18n="ui.theme"></span>
      <select id="theme">
        <option value="system" data-i18n="theme.system"></option>
        <option value="light" data-i18n="theme.light"></option>
        <option value="dark" data-i18n="theme.dark"></option>
      </select></label>
  </header>
  <main>
    <p id="guard" role="alert" hidden><span id="guard-text"></span> <button id="guard-excel" type="button" class="btn" hidden data-i18n="guard.excel"></button></p>
    <section aria-labelledby="h-new">
      <h2 id="h-new" data-i18n="home.new"></h2>
      <ul id="cards" class="cards"></ul>
      <p><button id="open-file" type="button" class="btn" data-i18n="home.open"></button>
        <span class="muted" data-i18n="home.open.hint"></span>
        <input id="file" type="file" hidden></p>
    </section>
    <section id="sec-templates" aria-labelledby="h-tpl" hidden>
      <h2 id="h-tpl" data-i18n="home.templates"></h2>
      <ul id="templates" class="cards"></ul>
    </section>
    <section aria-labelledby="h-recent">
      <h2 id="h-recent" data-i18n="home.recent"></h2>
      <p id="recent-note" class="muted" data-i18n="home.recent.note"></p>
      <ul id="recent" class="list"></ul>
      <p id="recent-empty" class="muted" hidden></p>
    </section>
    <section aria-labelledby="h-conv">
      <h2 id="h-conv" data-i18n="home.convert"></h2>
      <p><a id="convert" class="btn" href="/convert/"></a>
        <span class="muted" data-i18n="home.convert.hint"></span></p>
    </section>
    <p id="error" class="error" role="alert" hidden></p>
  </main>
</div>
<div id="editor" hidden>
  <div class="bar">
    <button id="back" type="button" class="btn" data-i18n="ed.back"></button>
    <strong id="ed-title"></strong>
    <span id="ed-status" class="muted" role="status"></span>
  </div>
  <div id="frames"></div>
</div>
<div id="history" hidden>
  <header class="bar">
    <button id="hist-back" type="button" class="btn" data-i18n="hist.back"></button>
    <div id="hist-title" role="heading" aria-level="1" tabindex="-1" data-i18n="hist.title"></div>
  </header>
  <main>
    <p id="hist-web" hidden data-i18n="hist.web"></p>
    <div id="hist-body">
      <p id="hist-msg" class="muted" role="status"></p>
      <section aria-labelledby="h-docs">
        <h2 id="h-docs" data-i18n="hist.docs"></h2>
        <ul id="hist-docs" class="list"></ul>
        <p id="hist-none" class="muted" hidden data-i18n="hist.docs.none"></p>
      </section>
      <section id="hist-ver-sec" aria-labelledby="h-vers" hidden>
        <h2 id="h-vers" tabindex="-1"></h2>
        <p id="hist-chain" role="status"></p>
        <p><button id="hist-forget" type="button" class="btn ghost" data-i18n="hist.forget"></button></p>
        <div id="hist-cmp-bar" class="cmpbar" hidden>
          <label><span data-i18n="hist.cmp.from"></span> <select id="hist-cmp-a"></select></label>
          <label><span data-i18n="hist.cmp.to"></span> <select id="hist-cmp-b"></select></label>
          <button id="hist-cmp-go" type="button" class="btn" data-i18n="hist.compare"></button>
        </div>
        <ul id="hist-vers" class="list vers"></ul>
      </section>
      <section id="hist-cmp-sec" aria-labelledby="h-cmp" hidden>
        <h2 id="h-cmp" tabindex="-1"></h2>
        <p id="hist-cmp-none" class="muted" hidden data-i18n="hist.cmp.none"></p>
        <ul id="hist-cmp" class="list cmp"></ul>
        <p><button id="hist-cmp-close" type="button" class="btn ghost" data-i18n="hist.cmp.close"></button></p>
      </section>
    </div>
  </main>
  <dialog id="hist-restore" aria-labelledby="hist-restore-title">
    <form method="dialog">
      <h2 id="hist-restore-title"></h2>
      <p id="hist-restore-body"></p>
      <p><button type="submit" value="ok" class="btn" data-i18n="hist.restore.ok"></button>
        <button type="submit" value="" class="btn ghost" data-i18n="hist.cancel"></button></p>
    </form>
  </dialog>
  <dialog id="hist-name" aria-labelledby="hist-name-title">
    <form method="dialog">
      <h2 id="hist-name-title"></h2>
      <p><label><span data-i18n="hist.name.label"></span><br><input id="hist-name-input" type="text" maxlength="200" autocomplete="off"></label></p>
      <p><button type="submit" value="ok" class="btn" data-i18n="hist.name.ok"></button>
        <button type="submit" value="" class="btn ghost" data-i18n="hist.cancel"></button></p>
    </form>
  </dialog>
  <dialog id="hist-forget-dlg" aria-labelledby="hist-forget-title">
    <form method="dialog">
      <h2 id="hist-forget-title"></h2>
      <p data-i18n="hist.forget.body"></p>
      <p><button type="submit" value="ok" class="btn" data-i18n="hist.forget.ok"></button>
        <button type="submit" value="" class="btn ghost" data-i18n="hist.cancel"></button></p>
    </form>
  </dialog>
</div>
<script src="shell/shell.js"></script>
<script src="shell/history-ui.js"></script>
<script src="shell/history.js"></script>
</body>
</html>
