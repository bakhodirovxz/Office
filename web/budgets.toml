# Web size budgets (PLAN section 6.4). Read by `scripts/ci.sh sizes`. Sizes are bytes of dist/*-web/*.wasm and *.js,
# measured with `brotli -q 11 --lgwin=24` and `gzip -9` (the same tool for the budget and the BASE measurement).
#
# Budget per domain = base_br + delta_br_max (wasm brotli). The ratchet is on OUR delta, not on upstream growth:
#   base_br    pristine upstream brotli at BASE, measured 2026-10-19 (WP6 final) with this tool: a scratch worktree with
#              upstream/<app> replaced by the pristine commit (no queue, no overlay, no catalogs), built through the same domain
#              wrapper with `OFFICE_NO_OVERLAY=1 scripts/build.sh <d> web --release`. Re-measure at every sync together with
#              base_sha (`scripts/ci.sh sizes --measure-base` prints the dist numbers to paste in).
#   delta_br_max   hard fail when (our brotli - base_br) exceeds it.
#   js_br_max      hard fail when the JS glue brotli exceeds it (all apps: 24 KiB; measured 19.7-20.6 KB).
#   upstream_growth_warn   warn (never fail) when a re-measured base_br grew by more than this fraction since the last sync.
#   craft_fonts    part of the budget key: true when the wasm embeds Inter and BIZ UDPGothic (CRAFT_FONTS_DIR set at build,
#                  F9). Measure both settings in WP3 and recommend one; the budget applies to the setting named here.
#
# Headroom rules:
#   * The temporary 512 KiB guard is gone (WP6 final, 2026-10-19). delta_br_max = measured delta + 10%, rounded up to
#     16 KiB (16384). The measured delta is our whole layer: carried queue + brand overlay + fallback fonts + Uzbek catalogs
#     (see docs/phase1/wp6-final.md for the breakdown and the dist numbers).
#   * Raising any delta_br_max above its measured value + 10% needs a STATUS line with the reason.
#   * Absolute budgets per editor (the shell's lazy-load budget) belong to Phase 4.
#
# `domain` is the build domain (dist/<domain>-web); `app` is the upstream product it is built from.

[docs]
app = "wordcraft"
base_sha = "eae2421"
craft_fonts = false
base_raw = 42219232          # pristine wasm raw at BASE (2026-10-19)
base_gzip = 15735172         # wasm gzip -9
base_br = 9377090            # wasm brotli -q 11 --lgwin=24
js_br = 20548                # JS glue brotli
delta_br_max = 131072        # delta +105,622 B brotli (+1.13 %): queue 0001-0005, overlay 0100-0103, 0110 catalogs, fallback fonts; ceil(1.10 x delta / 16 KiB) x 16 KiB
js_br_max = 24576
upstream_growth_warn = 0.05

