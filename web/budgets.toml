# The uz-translit npm package (PLAN phase 2 section 7; `scripts/ci.sh translit-npm` builds it, `sizes` checks it). Not an
# upstream-based domain: no base, the budget is the measured value + 10 %, rounded up to 16 KiB (the rule above).
# Measured 2026-10-20 (v0.1.0, wasm-opt -Oz): wasm raw 72345, gzip 36169, brotli 30671; JS glue brotli 3142; tarball 46771.
# The plan projected about 20 KB brotli; the embedded dictionary makes it 30.7 KB.
[npm.uz-translit]
wasm_br_max = 49152
js_br_max = 16384

# The home shell (PLAN phase 4 WP7): index.html + shell.js + shell.css + i18n.json + templates.json + the Noto Sans Uz subset,
# each brotli -q 11 --lgwin=24, summed (`ci.sh sizes` measures web/shell and assets/fonts/fallback directly). No editor wasm is in it.
# Measured 2026-10-22: 45,417 B brotli (the font is 38,933 of it). br_max = ceil(1.10 x measured / 16 KiB) x 16 KiB. The plan's proposal
# was 160 KiB; the measured rule gives 64 KiB, which is what stays enforced (raise it only with a STATUS line).
[shell]
br_max = 65536

# The plugin page host (PLAN phase 7 WP5): web/plugins/host.js + worker.js + host.css + i18n.json, each brotli -q 11 --lgwin=24, summed
# (`ci.sh sizes` measures web/plugins). A lazy chunk: the shell and the docserver wrapper fetch it only when a plugin is enabled, so it is
# not part of [shell] (whose headroom is under 1 KB). Measured 2026-11-03: 9,820 B brotli. br_max = ceil(1.10 x measured / 16 KiB) x 16 KiB.
# WP8 added page.js (the lazily loaded Plugins page, opened from the shell's nav button) and its strings: 12,847 B; br_max unchanged.
[plugins]
br_max = 16384
