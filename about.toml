# cargo-about 0.9.2 config for the MSI third-party notices (scripts/gen-notices.sh). The allow list is deny.toml's, plus the
# three documented deny exceptions; scripts/gen-notices.sh additionally pins MPL-2.0 to the symphonia crates.
accepted = [
    "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
    "Unicode-3.0", "BSL-1.0", "CC0-1.0",
    "MPL-2.0", "OFL-1.1", "Ubuntu-font-1.0", "CDLA-Permissive-2.0",
]
targets = ["x86_64-pc-windows-gnu", "x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
