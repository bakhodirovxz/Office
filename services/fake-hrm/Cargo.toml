[package]
name = "fake-hrm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Test harness: a stand-in for the HR backend's ONLYOFFICE integration, faithful to docs/phase0/hrm-current-state.md 4.2-4.3 (PLAN phase 5, WP1)"

[lints]
workspace = true

[lib]
name = "fake_hrm"

[[bin]]
name = "fake-hrm"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
serde_json = "1"
# hand-rolled HS256, as convert-api (no jsonwebtoken, so no rsa crate)
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
# blocking client for the save download (httpx in the original), run on spawn_blocking
ureq = { version = "3", default-features = false }
