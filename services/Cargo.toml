# Services workspace (PLAN phase 3, section 2.1; F12). Own lock, own policy: ci/deny/services.toml.
# Excluded from the root workspace (Cargo.toml `exclude`). Links no engine: it runs the domain CLIs as processes.
[workspace]
members = ["convert"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
