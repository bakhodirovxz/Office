[package]
name = "convert"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Document converter CLI and library: planner, executor and report over the four domain CLIs (PLAN phase 3, section 2)"

[lints]
workspace = true

[lib]
name = "convert"

[[bin]]
name = "convert"
path = "src/main.rs"

# Test-only fault injection tool (WP2 step 5). Built with the package so integration tests find it via CARGO_BIN_EXE_*.
[[bin]]
name = "convert-fake-tool"
path = "src/bin/fake_tool.rs"

[dependencies]
# Ours (MIT OR Apache-2.0, no dependencies): only for DEFAULT_LATIN_ALPHABET, the one default switch (O13).
uz-translit = { path = "../../crates/uz-translit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# png decoding and encoding for the XDFU watermark on png outputs (WP15): MIT OR Apache-2.0
png = "0.18"
# cp1251, cp1252 and UTF-16 text to UTF-8 (text.rs): (Apache-2.0 OR MIT) AND BSD-3-Clause
encoding_rs = "0.8"
zip = { version = "9", default-features = false, features = ["deflate"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
# Blocking HTTP client for the sidecars, no TLS (they sit on an internal network): MIT OR Apache-2.0. PLAN 2.1.
ureq = { version = "3", default-features = false }
# The OS user locale for the CLI's default `--locale` (GetUserDefaultLocaleName on Windows); the unsafe code is inside the crate: MIT OR Apache-2.0
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
# safe wrapper over Win32 Job Objects (kill-on-close, memory limit); keeps our crates free of `unsafe`
win32job = "2"
