[package]
name = "docserver"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The document server (PLAN phase 5, WP2): config with its refusals, the /ds/ routes, the internal listener and the cross-site framing rules. Mounted by suite-serve only when the config has a [docserver] section"

[lints]
workspace = true

[lib]
name = "docserver"

[dependencies]
convert-api = { path = "../convert-api" }
# the zip central-directory scan against zip bombs (`scan::scan_entries`), the same rules as the converter
convert = { path = "../convert" }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# the outbound client of the fetch and the callbacks (same crate and features as convert-api; no TLS yet, see outbound.rs)
ureq = { version = "3", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
# the HS256 subkeys of our own tokens (same crates as convert-api's jwt.rs), and the OS random source of session ids
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.2"
# at-rest encryption (WP14): the AEAD convert-api already uses
aes-gcm = "0.10"
# XDFU stamping (WP14): the grif finder, the stamp line and the keyed copy chain
xdfu-core = { path = "../../crates/xdfu-core" }
# the server version store: the id API and keyed chain of suite-core history
suite-core = { path = "../../crates/suite-core" }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tower = { version = "0.5", features = ["util"] }
fake-hrm = { path = "../fake-hrm" }
base64 = "0.22"
